<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<meta name="description" content="Le tue foto di Google Foto, anche gli album condivisi, sulla Fire TV Stick. App Android TV open source.">
<link rel="icon" type="image/png" href="icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Foto TV">
<meta property="og:title" content="Foto TV - Google Foto sulla Fire TV">
<meta property="og:description" content="Le tue foto di Google Foto, anche gli album condivisi, sulla Fire TV Stick. App Android TV open source.">
<meta property="og:url" content="https://armando-basile.github.io/google-photos/">
<meta property="og:image" content="https://armando-basile.github.io/google-photos/social-preview.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Foto TV - Google Foto sulla Fire TV">
<meta name="twitter:description" content="Le tue foto di Google Foto, anche gli album condivisi, sulla Fire TV Stick.">
<meta name="twitter:image" content="https://armando-basile.github.io/google-photos/social-preview.png">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #202124; color: #e8eaed; }
  main { max-width: 28rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; }
  a { color: #8ab4f8; }
</style>
</head>
<body>
<main>
  <h1 id="title">Collegamento in corso...</h1>
  <p id="msg"></p>
  <p id="links" hidden>
    <a href="https://github.com/armando-basile/google-photos/releases/latest">Scarica l'ultimo APK</a> &middot;
    <a href="https://github.com/armando-basile/google-photos">Codice sorgente</a>
  </p>
</main>
<script>
(() => {
  const SCOPE = "https://www.googleapis.com/auth/photospicker.mediaitems.readonly";
  const TV_RE = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}):\d{2,5}$/;
  const params = new URLSearchParams(location.search);
  const redirectUri = location.origin + location.pathname;

  const show = (title, msg) => {
    document.getElementById("title").textContent = title;
    document.getElementById("msg").textContent = msg || "";
  };
  const b64u = (s) => btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64u = (s) => atob(s.replace(/-/g, "+").replace(/_/g, "/"));

  try {
    if (params.has("state") && (params.has("code") || params.has("error"))) {
      const { tv, n } = JSON.parse(unb64u(params.get("state")));
      if (!TV_RE.test(tv)) throw new Error("Indirizzo della TV non valido");
      const back = new URLSearchParams({ state: n });
      if (params.has("code")) back.set("code", params.get("code"));
      else back.set("error", params.get("error"));
      show("Torno alla TV...", "Se non succede nulla, assicurati che telefono e TV siano sulla stessa rete Wi-Fi.");
      location.replace("http://" + tv + "/callback?" + back.toString());
    } else if (params.has("cid") && params.has("cc") && params.has("tv") && params.has("n")) {
      const tv = params.get("tv");
      if (!TV_RE.test(tv)) throw new Error("Indirizzo della TV non valido");
      const state = b64u(JSON.stringify({ tv, n: params.get("n") }));
      const auth = new URLSearchParams({
        client_id: params.get("cid"),
        redirect_uri: redirectUri,
        response_type: "code",
        scope: SCOPE,
        code_challenge: params.get("cc"),
        code_challenge_method: "S256",
        access_type: "offline",
        prompt: "consent",
        state,
      });
      show("Apro l'accesso a Google...");
      location.replace("https://accounts.google.com/o/oauth2/v2/auth?" + auth.toString());
    } else {
      show("Foto TV", "Scansiona il codice QR mostrato sulla TV per collegare il tuo account Google Foto.");
      document.getElementById("links").hidden = false;
    }
  } catch (e) {
    show("Errore", e.message);
  }
})();
</script>
</body>
</html>
