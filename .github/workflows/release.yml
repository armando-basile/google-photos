name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # I segreti sono nell'environment "Main" (il nome distingue maiuscole e minuscole).
    environment: Main
    steps:
      - name: Check tag format
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "Il tag '$TAG' deve avere la forma v1.2.3" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          # 1.2.3 -> 1002003: cresce in modo monotono finché ogni parte resta sotto 1000
          echo "code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_CLIENT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Segreti mancanti::Vuoti o non definiti:${missing}. Aggiungili nell'environment Main (Settings > Environments)."
            exit 1
          fi

          keystore="$RUNNER_TEMP/release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore" 2>/dev/null; then
            echo "::error title=Keystore non valido::ANDROID_KEYSTORE_BASE64 non è base64 valido. Rigenera con: base64 -w0 release.jks"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error title=Controllo keystore fallito::Password errata o alias inesistente."
            exit 1
          fi
          echo "KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify signature and prepare assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="FotoTV-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
